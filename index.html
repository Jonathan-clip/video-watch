<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16302b">
<title>מעקב סרטוני AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>מעקב סרטוני AI</h1>
    <button class="icon-btn" id="menuBtn" aria-label="תפריט">⋯</button>
  </div>
  <div class="progress" aria-label="התקדמות">
    <div class="bar"><span id="barFill"></span></div>
    <div class="progress-text"><b id="pDone">0</b> מתוך <b id="pTotal">0</b> נצפו · <span id="pNext"></span></div>
  </div>
  <div class="filters">
    <input id="search" type="search" placeholder="חיפוש לפי שם, יוצר או טכניקה" aria-label="חיפוש">
    <div class="seg" id="statusSeg" role="tablist">
      <button data-s="all" class="on">הכל</button>
      <button data-s="todo">לא נצפו</button>
      <button data-s="done">נצפו</button>
      <button data-s="top">10 להתחלה</button>
    </div>
    <div class="row2">
      <select id="tagSel" aria-label="תגית"><option value="">כל התגיות</option></select>
      <select id="sortSel" aria-label="מיון">
        <option value="rec">סדר מומלץ</option>
        <option value="views">הכי נצפים</option>
        <option value="rating">דירוג שלי</option>
      </select>
    </div>
  </div>
</header>

<main id="list" class="list"></main>

<div class="menu" id="menu" hidden>
  <button id="exportBtn">שמירת גיבוי (קובץ)</button>
  <button id="importBtn">שחזור מגיבוי</button>
  <button id="resetBtn">איפוס כל הסימונים</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>

<section class="detail" id="detail" hidden>
  <div class="detail-bar">
    <button class="icon-btn" id="closeBtn" aria-label="חזרה">→</button>
    <span class="detail-pos" id="dPos"></span>
    <div class="nav">
      <button class="icon-btn" id="prevBtn" aria-label="הקודם">‹</button>
      <button class="icon-btn" id="nextBtn" aria-label="הבא">›</button>
    </div>
  </div>
  <div class="detail-body">
    <div class="player-wrap"><div id="player"></div><div class="player-fallback" id="fallback" hidden></div></div>
    <div class="d-info">
      <h2 id="dTitle"></h2>
      <p class="d-meta" id="dMeta"></p>
      <p class="warn" id="dWarn" hidden></p>
      <div class="d-actions">
        <button class="primary" id="watchedBtn"></button>
        <a class="ghost" id="ytLink" target="_blank" rel="noopener">פתיחה ביוטיוב</a>
      </div>
      <div class="stars" id="stars" aria-label="דירוג"></div>
      <div class="sec"><h3>למה לצפות</h3><p id="dWhy"></p><p id="dDesc" class="muted"></p></div>
      <div class="sec">
        <h3>תגיות</h3>
        <div class="tags" id="dTags"></div>
        <form id="tagForm" class="inline"><input id="tagInput" list="tagList" placeholder="תגית חדשה, למשל: ליישם"><datalist id="tagList"></datalist><button>הוספה</button></form>
      </div>
      <div class="sec">
        <h3>הערות</h3>
        <form id="noteForm">
          <textarea id="noteText" rows="2" placeholder="כתיבת הערה"></textarea>
          <div class="note-actions">
            <label class="check"><input type="checkbox" id="noteStamp" checked> לצרף את הזמן בסרטון <b id="nowTime">0:00</b></label>
            <button class="primary">שמירה</button>
          </div>
        </form>
        <ul class="notes" id="notes"></ul>
      </div>
    </div>
  </div>
</section>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
